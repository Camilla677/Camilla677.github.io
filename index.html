<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body class="bg-[#04010a] text-[#00ffcc] overflow-x-hidden selection:bg-[#ff007f] selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- WEB AUDIO API ENGINE ---
      class AudioEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        init() {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playTone(freq, type, duration, slideTo = null) {
          if (this.muted) return;
          this.init();
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideTo) {
              osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
            }
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch (e) {
            console.warn("Audio Context init error:", e);
          }
        }

        playCoin() { this.playTone(587.33, 'square', 0.15, 880); }
        playJump() { this.playTone(150, 'triangle', 0.2, 600); }
        playHit() { this.playTone(300, 'sawtooth', 0.3, 40); }
        playWin() { this.playTone(523.25, 'sine', 0.1); setTimeout(() => this.playTone(659.25, 'sine', 0.15), 100); }
        playPoint() { this.playTone(880, 'sine', 0.08, 1200); }
      }

      const audio = new AudioEngine();

      // --- DATA PRESETS ---
      const GACHAPON_PRIZES = [
        { id: "nokia", name: "3310 Prototype", rarity: "Legendary", desc: "Virtually indestructible. Restores cellular networks.", cost: 15, icon: "📱" },
        { id: "floppy", name: "Glitch Floppy Disk", rarity: "Common", desc: "1.44MB storage. Holds critical core scripts.", cost: 5, icon: "💾" },
        { id: "beeper", name: "Neon Translucent Pager", rarity: "Rare", desc: "For secure telemetry text exchanges.", cost: 10, icon: "📟" },
        { id: "tamagotchi", name: "Cyber Pet v0.9", rarity: "Legendary", desc: "Requires persistent clock cycles to sustain.", cost: 20, icon: "👾" },
        { id: "dialup", name: "56K Acoustic Coupler", rarity: "Rare", desc: "Translates analog waveforms to dynamic streams.", cost: 10, icon: "🔌" }
      ];

      const INITIAL_HIGH_SCORES = [
        { name: "NEO_99", score: 120, game: "Flappy Cyber-Bird" },
        { name: "BUG_SLAYER", score: 85, game: "Cyber Fence Jumper" },
        { name: "TRINITY", score: 11, game: "Neon Pong" },
        { name: "CYBER_PUNK", score: 240, game: "Retro Worm" }
      ];

      // --- MAIN REACT APPLICATION ---
      function App() {
        const [activeGame, setActiveGame] = useState("lobby");
        const [tokens, setTokens] = useState(25);
        const [unlockedPrizes, setUnlockedPrizes] = useState([]);
        const [crtOverlay, setCrtOverlay] = useState(true);
        const [highScores, setHighScores] = useState(INITIAL_HIGH_SCORES);
        const [playerName, setPlayerName] = useState("GUEST_NET");
        const [volumeMuted, setVolumeMuted] = useState(false);

        useEffect(() => {
          // Load localStorage if available
          const localPrizes = localStorage.getItem("y2k_arcade_prizes");
          if (localPrizes) setUnlockedPrizes(JSON.parse(localPrizes));
          const localScores = localStorage.getItem("y2k_arcade_scores");
          if (localScores) setHighScores(JSON.parse(localScores));
          const localTokens = localStorage.getItem("y2k_arcade_tokens");
          if (localTokens) setTokens(Number(localTokens));
        }, []);

        const saveHighScore = (score, gameName) => {
          if (score <= 0) return;
          const newScore = { name: playerName, score, game: gameName };
          const updated = [...highScores, newScore]
            .sort((a, b) => b.score - a.score)
            .slice(0, 8);
          setHighScores(updated);
          localStorage.setItem("y2k_arcade_scores", JSON.stringify(updated));
        };

        const awardTokens = (amount) => {
          setTokens(prev => {
            const next = prev + amount;
            localStorage.setItem("y2k_arcade_tokens", String(next));
            return next;
          });
          audio.playCoin();
        };

        const handlePurchasePrize = (prize) => {
          if (tokens < prize.cost) {
            audio.playHit();
            alert("INSUFFICIENT CREDITS. Accumulate more tokens via simulation runs.");
            return;
          }
          if (unlockedPrizes.includes(prize.id)) {
            alert("You already unlocked this digital artifact.");
            return;
          }
          audio.playWin();
          const nextTokens = tokens - prize.cost;
          const nextPrizes = [...unlockedPrizes, prize.id];
          setTokens(nextTokens);
          setUnlockedPrizes(nextPrizes);
          localStorage.setItem("y2k_arcade_tokens", String(nextTokens));
          localStorage.setItem("y2k_arcade_prizes", JSON.stringify(nextPrizes));
        };

        const toggleMute = () => {
          audio.muted = !audio.muted;
          setVolumeMuted(audio.muted);
        };

        return (
          <div className="min-h-screen bg-[#06020f] text-[#00ffcc] flex flex-col relative overflow-hidden">
            {/* CRT TV FX Overlay */}
            {crtOverlay && (
              <div className="pointer-events-none fixed inset-0 z-50 opacity-[0.07] overflow-hidden">
                <div className="scanline-effect w-full h-full bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.45)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_6px,6px_100%]" />

            <header className="border-b-4 border-[#ff007f] bg-[#0c051a] p-4 flex flex-wrap justify-between items-center gap-4 z-10 shadow-[0_4px_20px_rgba(255,0,127,0.25)]">

                </div>
                <div className="hidden md:inline border border-[#00ffcc]/30 px-2 py-0.5 text-xs text-gray-400">
                  SYS_STATUS: ACTIVE
                </div>

              <div className="flex items-center space-x-4">
                <div className="bg-[#110924] border-2 border-[#00ffcc] px-3 py-1 flex items-center gap-2">

                <button

              {/* Left Sidebar Control Deck */}

                  <div className="space-y-3">

                {/* Winamp-style Synthesized MIDI Simulator */}

                {/* Cabinet Global Leaderboard */}

              {/* Central Cabinet Main Screen */}

                    CYBER-BIRD

                  <button
                    onClick={() => { audio.playCoin(); setActiveGame("jumper"); }}
                    className={`flex-1 min-w-[100px] text-center py-2 text-xs font-bold transition-all ${activeGame === "jumper" ? "bg-[#00ffcc] text-black" : "hover:bg-white/5 text-gray-400"}`}
                  >
                    FENCE JUMPER
                  </button>
                  <button
                    onClick={() => { audio.playCoin(); setActiveGame("pong"); }}
                    className={`flex-1 min-w-[100px] text-center py-2 text-xs font-bold transition-all ${activeGame === "pong" ? "bg-[#00ffcc] text-black" : "hover:bg-white/5 text-gray-400"}`}
                  >
                    PONG
                  </button>
                  <button
                    onClick={() => { audio.playCoin(); setActiveGame("worm"); }}
                    className={`flex-1 min-w-[100px] text-center py-2 text-xs font-bold transition-all ${activeGame === "worm" ? "bg-[#00ffcc] text-black" : "hover:bg-white/5 text-gray-400"}`}
                  >
                    RETRO WORM
                  </button>
                </div>

                {/* Dynamic Screen Housing */}
                <div className="border-4 border-[#00ffcc] bg-black p-4 rounded-xl min-h-[460px] relative flex flex-col shadow-[0_0_30px_rgba(0,255,204,0.15)]">
                  {/* Decorative Reflection */}
                  <div className="absolute inset-0 pointer-events-none rounded bg-gradient-to-tr from-transparent via-white/[0.02] to-white/[0.06] z-10" />

                  {activeGame === "lobby" && (
                    <div className="flex-1 flex flex-col justify-center items-center text-center p-4">
                      <div className="text-3xl font-extrabold text-[#ff007f] animate-pulse mb-2">
                        INSERT COIN TO START
                      </div>
                      <p className="text-xs text-gray-400 max-w-sm mb-8">
                        Earn 1 🪙 token for every milestone points accumulated across each terminal simulation below.
                      </p>

                      <div className="grid grid-cols-2 gap-4 w-full">
                        <div onClick={() => { audio.playCoin(); setActiveGame("flappy"); }} className="border border-dashed border-[#ff007f] hover:bg-[#ff007f]/5 p-3 rounded cursor-pointer transition-colors text-center">
                          <span className="text-2xl">🐦</span>
                          <h4 className="text-xs font-extrabold mt-1">FLAPPY CYBER-BIRD</h4>
                        </div>
                        <div onClick={() => { audio.playCoin(); setActiveGame("jumper"); }} className="border border-dashed border-[#00ffcc] hover:bg-[#00ffcc]/5 p-3 rounded cursor-pointer transition-colors text-center">
                          <span className="text-2xl">🏃</span>
                          <h4 className="text-xs font-extrabold mt-1">FENCE JUMPER</h4>
                        </div>
                        <div onClick={() => { audio.playCoin(); setActiveGame("pong"); }} className="border border-dashed border-[#00ffcc] hover:bg-[#00ffcc]/5 p-3 rounded cursor-pointer transition-colors text-center">
                          <span className="text-2xl">🏓</span>
                          <h4 className="text-xs font-extrabold mt-1">NEON PONG</h4>
                        </div>
                        <div onClick={() => { audio.playCoin(); setActiveGame("worm"); }} className="border border-dashed border-[#ff007f] hover:bg-[#ff007f]/5 p-3 rounded cursor-pointer transition-colors text-center">
                          <span className="text-2xl">🐍</span>
                          <h4 className="text-xs font-extrabold mt-1">RETRO WORM</h4>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeGame === "flappy" && (
                    <FlappyBirdGame onSave={saveHighScore} onAward={awardTokens} />
                  )}

                  {activeGame === "jumper" && (
                    <FenceJumperGame onSave={saveHighScore} onAward={awardTokens} />
                  )}

                  {activeGame === "pong" && (
                    <PongGame onSave={saveHighScore} onAward={awardTokens} />
                  )}

                  {activeGame === "worm" && (
                    <WormGame onSave={saveHighScore} onAward={awardTokens} />
                  )}
                </div>
              </section>

              {/* Right Sidebar Gachapon Prize Shop */}
              <section className="lg:col-span-1 flex flex-col space-y-6">
                <div className="border border-[#ff007f] bg-[#0c051a] p-4 rounded shadow-[0_0_15px_rgba(255,0,127,0.15)] flex-1 flex flex-col justify-between">
                  <div>
                    <h3 className="text-xs uppercase font-extrabold text-[#ff007f] mb-3 tracking-widest border-b border-[#ff007f]/30 pb-1 flex items-center justify-between">
                      <span>🎟️ TOKENS EXCHANGE</span>
                      <span className="text-[10px] bg-[#ff007f]/20 text-white px-2 py-0.5 rounded">STORE</span>
                    </h3>
                    <p className="text-[11px] text-gray-400 mb-4">
                      Convert earned tokens into limited edition virtual artifacts. Collect them all.
                    </p>

                    <div className="space-y-3">
                      {GACHAPON_PRIZES.map((prize) => {
                        const isUnlocked = unlockedPrizes.includes(prize.id);
                        return (
                          <div key={prize.id} className="border border-gray-800 bg-[#080214] p-2 flex justify-between items-center text-xs">
                            <div className="flex items-center space-x-2">
                              <span className="text-xl">{prize.icon}</span>
                              <div>
                                <h4 className={`font-bold ${isUnlocked ? "text-gray-500 line-through" : "text-white"}`}>{prize.name}</h4>
                                <p className="text-[9px] text-gray-400">{prize.desc}</p>
                              </div>
                            </div>
                            <button
                              disabled={isUnlocked}
                              onClick={() => handlePurchasePrize(prize)}
                              className={`px-2 py-1 text-[10px] font-extrabold transition-all border ${isUnlocked ? 'border-gray-800 text-gray-500 cursor-not-allowed' : 'border-[#ff007f] hover:bg-[#ff007f] hover:text-white text-[#ff007f]'}`}
                            >
                              {isUnlocked ? "OWNED" : `${prize.cost}🪙`}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-[#ff007f]/20 mt-4 text-center">
                    <span className="text-[11px] text-[#00ffcc] font-bold">
                      UNLOCKED ARTIFACTS: {unlockedPrizes.length} / {GACHAPON_PRIZES.length}
                    </span>
                  </div>
                </div>
              </section>
            </main>

            <footer className="bg-black text-[10px] text-gray-500 text-center py-3 border-t border-gray-900 mt-auto">
              © 1999-2000 CYBERNECTICS DECK SYSTEMS. ALL CODEPIXELS OPERATE INDEPENDENTLY.
            </footer>
          </div>
        );
      }

      // --- GAME 1: FLAPPY CYBER-BIRD ---
      function FlappyBirdGame({ onSave, onAward }) {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);

        const stateRef = useRef({
          birdY: 150,
          velocity: 0,
          gravity: 0.35,
          jump: -6,
          pipes: [],
          frame: 0,
          score: 0,
          gameOver: false
        });

        const resetGame = () => {
          stateRef.current = {
            birdY: 150,
            velocity: 0,
            gravity: 0.35,
            jump: -6.5,
            pipes: [],
            frame: 0,
            score: 0,
            gameOver: false
          };
          setScore(0);
          setGameState("playing");
          audio.playCoin();
        };

        const handleAction = () => {
          if (gameState === "idle" || gameState === "over") {
            resetGame();
          } else {
            stateRef.current.velocity = stateRef.current.jump;
            audio.playJump();
          }
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === " " || e.key === "ArrowUp") {
              e.preventDefault();
              handleAction();
            }
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [gameState]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animId;

          const render = () => {
            const state = stateRef.current;
            ctx.fillStyle = "#03010b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vector grid background
            ctx.strokeStyle = "rgba(0, 255, 120, 0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
              ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            if (gameState === "playing") {
              state.frame++;
              state.velocity += state.gravity;
              state.birdY += state.velocity;

              // Generate pipes
              if (state.frame % 100 === 0) {
                const gap = 90;
                const minH = 40;
                const maxH = canvas.height - gap - minH;
                const topH = Math.floor(Math.random() * (maxH - minH)) + minH;
                state.pipes.push({
                  x: canvas.width,
                  topHeight: topH,
                  bottomY: topH + gap,
                  width: 35,
                  passed: false
                });
              }

              // Update pipes
              for (let i = state.pipes.length - 1; i >= 0; i--) {
                const p = state.pipes[i];
                p.x -= 2;

                // Draw Top Pipe
                ctx.fillStyle = "rgba(255, 0, 127, 0.15)";
                ctx.strokeStyle = "#ff007f";
                ctx.lineWidth = 2;
                ctx.fillRect(p.x, 0, p.width, p.topHeight);
                ctx.strokeRect(p.x, 0, p.width, p.topHeight);

                // Draw Bottom Pipe
                ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
                ctx.strokeRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);

                // Score criteria
                if (!p.passed && p.x + p.width < 50) {
                  p.passed = true;
                  state.score++;
                  setScore(state.score);
                  audio.playPoint();
                  if (state.score % 10 === 0) {
                    onAward(1);
                  }
                }

                // Collisions
                if (
                  (50 + 10 > p.x && 50 - 10 < p.x + p.width) &&
                  (state.birdY - 10 < p.topHeight || state.birdY + 10 > p.bottomY)
                ) {
                  state.gameOver = true;
                }

                if (p.x + p.width < 0) {
                  state.pipes.splice(i, 1);
                }
              }

              // Boundaries check
              if (state.birdY > canvas.height || state.birdY < 0) {
                state.gameOver = true;
              }

              if (state.gameOver) {
                setGameState("over");
                audio.playHit();
                onSave(state.score, "Flappy Cyber-Bird");
              }

              // Draw Cyber-Bird (Vector triangle)
              ctx.save();
              ctx.translate(50, state.birdY);
              const angle = Math.min(Math.max(state.velocity * 0.08, -0.6), 0.8);
              ctx.rotate(angle);
              ctx.fillStyle = "#00ffcc";
              ctx.strokeStyle = "#fff";
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(12, 0);
              ctx.lineTo(-10, -10);
              ctx.lineTo(-6, 0);
              ctx.lineTo(-10, 10);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            } else {
              // Draw static visual display
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 40, canvas.width - 40, canvas.height - 80);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 40, canvas.width - 40, canvas.height - 80);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("FLAPPY CYBER-BIRD v1.2", canvas.width / 2, 100);
                ctx.fillStyle = "#ff007f";
                ctx.fillText("TAP OR PRESS SPACE TO FLY", canvas.width / 2, 160);
                ctx.fillStyle = "gray";
                ctx.fillText("DODGE TERMINAL BINARY PILLARS", canvas.width / 2, 220);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("GAME OVER / CONNECTION DISRUPTED", canvas.width / 2, 90);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`SCORE ACCUMULATED: ${state.score}`, canvas.width / 2, 140);
                ctx.fillStyle = "white";
                ctx.fillText("TAP SCREEN TO RETRY RUN", canvas.width / 2, 200);
              }
            }

            animId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animId);
        }, [gameState]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">FLAPPY CYBER-BIRD</span>
              <span className="text-white font-bold">SCORE: {score}</span>
            </div>
            <div 
              onClick={handleAction}
              className="relative border-2 border-[#ff007f]/50 bg-black flex-1 flex items-center justify-center cursor-pointer"
            >
              <canvas ref={canvasRef} width={400} height={280} className="w-full aspect-[400/280] block" />
            </div>
            <div className="mt-2 text-center text-[11px] text-gray-500">
              CLICK OR PRESS SPACEBAR TO STEER FLIGHT FLAP
            </div>
          </div>
        );
      }

      // --- GAME 2: CYBER FENCE JUMPER (Dino Runner) ---
      function FenceJumperGame({ onSave, onAward }) {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);

        const stateRef = useRef({
          playerY: 0,
          velocity: 0,
          gravity: 0.6,
          isGrounded: true,
          obstacles: [],
          speed: 4,
          score: 0,
          frame: 0,
          gameOver: false
        });

        const resetGame = () => {
          stateRef.current = {
            playerY: 0,
            velocity: 0,
            gravity: 0.5,
            isGrounded: true,
            obstacles: [],
            speed: 4.5,
            score: 0,
            frame: 0,
            gameOver: false
          };
          setScore(0);
          setGameState("playing");
          audio.playCoin();
        };

        const handleJump = () => {
          if (gameState === "idle" || gameState === "over") {
            resetGame();
          } else if (stateRef.current.isGrounded) {
            stateRef.current.velocity = -9;
            stateRef.current.isGrounded = false;
            audio.playJump();
          }
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === " " || e.key === "ArrowUp") {
              e.preventDefault();
              handleJump();
            }
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [gameState]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animId;

          const render = () => {
            const state = stateRef.current;
            ctx.fillStyle = "#020108";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const floorY = canvas.height - 40;

            // Draw Wireframe floor line
            ctx.strokeStyle = "#ff007f";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            // Background horizontal floor vanishing line
            ctx.strokeStyle = "rgba(0, 255, 200, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, floorY + 15);
            ctx.lineTo(canvas.width, floorY + 15);
            ctx.stroke();

            if (gameState === "playing") {
              state.frame++;
              
              // Apply Physics to character
              state.velocity += state.gravity;
              state.playerY += state.velocity;

              if (state.playerY >= 0) {
                state.playerY = 0;
                state.velocity = 0;
                state.isGrounded = true;
              }

              // Update Score over frames
              state.score++;
              if (state.score % 10 === 0) {
                setScore(Math.floor(state.score / 10));
              }

              // Speed scaling
              state.speed = 4.5 + Math.floor(state.score / 200) * 0.5;

              // Obstacle spawn logic
              if (state.frame % 110 === 0 || (Math.random() < 0.005 && state.frame % 40 === 0)) {
                state.obstacles.push({
                  x: canvas.width,
                  width: 15 + Math.random() * 15,
                  height: 25 + Math.random() * 20
                });
              }

              // Render & move obstacles
              for (let i = state.obstacles.length - 1; i >= 0; i--) {
                const obs = state.obstacles[i];
                obs.x -= state.speed;

                // Draw barrier obstacle (Fence)
                ctx.fillStyle = "#00ffcc";
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.fillRect(obs.x, floorY - obs.height, obs.width, obs.height);
                ctx.strokeRect(obs.x, floorY - obs.height, obs.width, obs.height);

                // Simple fence crossbars
                ctx.strokeStyle = "#020108";
                ctx.beginPath();
                ctx.moveTo(obs.x, floorY - obs.height / 2);
                ctx.lineTo(obs.x + obs.width, floorY - obs.height / 2);
                ctx.stroke();

                // Simple Bounding Box Collision
                const playerHeight = 35;
                const playerWidth = 20;
                const playerX = 60;
                const realPlayerY = floorY - playerHeight + state.playerY;

                if (
                  playerX < obs.x + obs.width &&
                  playerX + playerWidth > obs.x &&
                  realPlayerY + playerHeight > floorY - obs.height
                ) {
                  state.gameOver = true;
                }

                if (obs.x + obs.width < 0) {
                  state.obstacles.splice(i, 1);
                }
              }

              if (state.gameOver) {
                setGameState("over");
                audio.playHit();
                const finalScore = Math.floor(state.score / 10);
                onSave(finalScore, "Cyber Fence Jumper");
                const tokensEarned = Math.floor(finalScore / 10);
                if (tokensEarned > 0) onAward(tokensEarned);
              }

              // Draw Running Player Avatar (Vector Neon Boxy Runner)
              const px = 60;
              const py = floorY - 35 + state.playerY;
              ctx.fillStyle = "#ff007f";
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2;
              ctx.fillRect(px, py, 20, 35);
              ctx.strokeRect(px, py, 20, 35);

              // Cyber-Visor element
              ctx.fillStyle = "#00ffcc";
              ctx.fillRect(px + 10, py + 5, 10, 5);

            } else {
              // Menu Stage visualizer
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 30, canvas.width - 40, canvas.height - 60);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 30, canvas.width - 40, canvas.height - 60);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("CYBER FENCE JUMPER", canvas.width / 2, 80);
                ctx.fillStyle = "#ff007f";
                ctx.fillText("PRESS JUMP OR SPACEBAR TO LEAP", canvas.width / 2, 140);
                ctx.fillStyle = "gray";
                ctx.fillText("JUMP OVER GROWING DEFENSIVE FIREWALL BARRIERS", canvas.width / 2, 190);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("COLLISION EXCEPTION DETECTED", canvas.width / 2, 80);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`SCORE ACCUMULATED: ${Math.floor(state.score / 10)}`, canvas.width / 2, 130);
                ctx.fillStyle = "white";
                ctx.fillText("TAP SCREEN TO JUMP / REBOOT RUN", canvas.width / 2, 190);
              }
            }

            animId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animId);
        }, [gameState]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">CYBER FENCE JUMPER</span>
              <span className="text-white font-bold">SCORE: {score}</span>
            </div>
            <div 
              onClick={handleJump}
              className="relative border-2 border-[#00ffcc]/50 bg-black flex-1 flex items-center justify-center cursor-pointer"
            >
              <canvas ref={canvasRef} width={400} height={280} className="w-full aspect-[400/280] block" />
            </div>
            <div className="mt-2 text-center text-[11px] text-gray-500">
              TAP CONTAINER OR PRESS SPACEBAR / UP-ARROW TO JUMP
            </div>
          </div>
        );
      }

      // --- GAME 3: NEON PONG (PING PONG) ---
      function PongGame({ onSave, onAward }) {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);

        const stateRef = useRef({
          playerY: 100,
          aiY: 100,
          paddleH: 50,
          paddleW: 8,
          ballX: 200,
          ballY: 140,
          ballDX: 3,
          ballDY: 1.5,
          score: 0,
          gameOver: false
        });

        const resetGame = () => {
          stateRef.current = {
            playerY: 110,
            aiY: 110,
            paddleH: 50,
            paddleW: 8,
            ballX: 200,
            ballY: 140,
            ballDX: 3.5 * (Math.random() > 0.5 ? 1 : -1),
            ballDY: (Math.random() * 2 - 1) * 2,
            score: 0,
            gameOver: false
          };
          setScore(0);
          setGameState("playing");
          audio.playCoin();
        };

        const handleMouseMove = (e) => {
          if (gameState !== "playing" || !canvasRef.current) return;
          const rect = canvasRef.current.getBoundingClientRect();
          const root = document.documentElement;
          const mouseY = e.clientY - rect.top - root.scrollTop;
          stateRef.current.playerY = mouseY - stateRef.current.paddleH / 2;
        };

        const handleTouchMove = (e) => {
          if (gameState !== "playing" || !canvasRef.current) return;
          const rect = canvasRef.current.getBoundingClientRect();
          const touchY = e.touches[0].clientY - rect.top;
          stateRef.current.playerY = touchY - stateRef.current.paddleH / 2;
        };

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          let animId;
          const ctx = canvas.getContext("2d");

          const render = () => {
            const state = stateRef.current;
            ctx.fillStyle = "#010806";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center Net
            ctx.strokeStyle = "rgba(0, 255, 200, 0.1)";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // clear dash

            if (gameState === "playing") {
              // Paddle boundaries
              if (state.playerY < 0) state.playerY = 0;
              if (state.playerY > canvas.height - state.paddleH) state.playerY = canvas.height - state.paddleH;

              // Simple AI tracking ball
              const aiCenter = state.aiY + state.paddleH / 2;
              if (aiCenter < state.ballY - 15) {
                state.aiY += 2.5;
              } else if (aiCenter > state.ballY + 15) {
                state.aiY -= 2.5;
              }
              if (state.aiY < 0) state.aiY = 0;
              if (state.aiY > canvas.height - state.paddleH) state.aiY = canvas.height - state.paddleH;

              // Move Ball
              state.ballX += state.ballDX;
              state.ballY += state.ballDY;

              // Ceiling/Floor Bounce
              if (state.ballY < 0 || state.ballY > canvas.height) {
                state.ballDY = -state.ballDY;
                audio.playTone(330, 'sine', 0.05);
              }

              // Paddle collision (Left / Player)
              if (state.ballX <= 20 + state.paddleW && state.ballX >= 20) {
                if (state.ballY >= state.playerY && state.ballY <= state.playerY + state.paddleH) {
                  state.ballDX = -state.ballDX;
                  state.ballDX *= 1.05; // accelerate speed slightly
                  state.score++;
                  setScore(state.score);
                  audio.playPoint();
                  if (state.score % 5 === 0) {
                    onAward(1);
                  }
                }
              }

              // Paddle collision (Right / AI)
              if (state.ballX >= canvas.width - 20 - state.paddleW && state.ballX <= canvas.width - 20) {
                if (state.ballY >= state.aiY && state.ballY <= state.aiY + state.paddleH) {
                  state.ballDX = -state.ballDX;
                  audio.playTone(440, 'sine', 0.05);
                }
              }

              // Scoring / Game Over triggers
              if (state.ballX < 0) {
                state.gameOver = true;
              }

              if (state.ballX > canvas.width) {
                // Return ball & give 3 points reward
                state.ballX = canvas.width / 2;
                state.ballDX = -3.5;
                state.score += 3;
                setScore(state.score);
                audio.playWin();
              }

              if (state.gameOver) {
                setGameState("over");
                audio.playHit();
                onSave(state.score, "Neon Pong");
              }

              // Draw Left Paddle
              ctx.fillStyle = "#ff007f";
              ctx.fillRect(20, state.playerY, state.paddleW, state.paddleH);

              // Draw Right Paddle
              ctx.fillStyle = "#00ffcc";
              ctx.fillRect(canvas.width - 20 - state.paddleW, state.aiY, state.paddleW, state.paddleH);

              // Draw Glowing Ball
              ctx.fillStyle = "#fff";
              ctx.shadowColor = "#00ffcc";
              ctx.beginPath();
              ctx.arc(state.ballX, state.ballY, 6, 0, Math.PI * 2);
              ctx.fill();
              ctx.shadowColor = "transparent"; // Reset shadow

            } else {
              // Static Landing screen elements
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 35, canvas.width - 40, canvas.height - 70);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 35, canvas.width - 40, canvas.height - 70);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("NEON PONG v1.0", canvas.width / 2, 80);
                ctx.fillStyle = "#ff007f";
                ctx.fillText("TAP OR CLICK IN SCREEN TO START PLAY", canvas.width / 2, 140);
                ctx.fillStyle = "gray";
                ctx.fillText("STEER PADDLE VERTICALLY TO BOUNCE WAVEFORMS", canvas.width / 2, 190);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("CONNECTION RESET / POINT CONCEDED", canvas.width / 2, 80);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`TOTAL POINTS: ${state.score}`, canvas.width / 2, 130);
                ctx.fillStyle = "white";
                ctx.fillText("TAP CONTAINER AREA TO RUN REBOOT", canvas.width / 2, 190);
              }
            }

            animId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animId);
        }, [gameState]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">NEON PONG SIMULATOR</span>
              <span className="text-[#00ffcc] font-bold">SCORE: {score}</span>
            </div>
            <div 
              onMouseMove={handleMouseMove}
              onTouchMove={handleTouchMove}
              onClick={() => { if (gameState !== "playing") resetGame(); }}
              className="relative border-2 border-[#00ffcc]/50 bg-black flex-1 flex items-center justify-center cursor-pointer overflow-hidden"
            >
              <canvas ref={canvasRef} width={400} height={280} className="w-full aspect-[400/280] block" />
            </div>
            <div className="mt-2 text-center text-[11px] text-gray-500">
              SLIDE MOUSE OR TOUCH DRAG ON MOBILE VERTICALLY TO STEER LEFT PADDLE
            </div>
          </div>
        );
      }

      // --- GAME 4: RETRO WORM (SNAKE) ---
      function WormGame({ onSave, onAward }) {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);

        const stateRef = useRef({
          worm: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
          dx: 1,
          dy: 0,
          food: { x: 15, y: 10 },
          gridSize: 20,
          score: 0,
          gameOver: false,
          lastUpdate: 0,
          speed: 120 // interval in milliseconds
        });

        const resetGame = () => {
          stateRef.current = {
            worm: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
            dx: 1,
            dy: 0,
            food: { x: 15, y: 12 },
            gridSize: 20,
            score: 0,
            gameOver: false,
            lastUpdate: 0,
            speed: 110
          };
          setScore(0);
          setGameState("playing");
          audio.playCoin();
        };

        const changeDirection = (newDx, newDy) => {
          const current = stateRef.current;
          // Block 180 degree instant reversal
          if (newDx === -current.dx || newDy === -current.dy) return;
          current.dx = newDx;
          current.dy = newDy;
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (gameState !== "playing") return;
            if (e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); changeDirection(0, -1); }
            if (e.key === "ArrowDown" || e.key === "s") { e.preventDefault(); changeDirection(0, 1); }
            if (e.key === "ArrowLeft" || e.key === "a") { e.preventDefault(); changeDirection(-1, 0); }
            if (e.key === "ArrowRight" || e.key === "d") { e.preventDefault(); changeDirection(1, 0); }
          };

          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [gameState]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animId;

          const render = (time) => {
            const state = stateRef.current;
            const cols = canvas.width / state.gridSize;
            const rows = canvas.height / state.gridSize;

            ctx.fillStyle = "#02010c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tech terminal grid structure
            ctx.strokeStyle = "rgba(0, 255, 120, 0.03)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += state.gridSize) {
              ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += state.gridSize) {
              ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if (gameState === "playing") {
              if (time - state.lastUpdate > state.speed) {
                state.lastUpdate = time;

                // Move head location
                const head = { x: state.worm[0].x + state.dx, y: state.worm[0].y + state.dy };

                // Boundaries collision
                if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                  state.gameOver = true;
                }

                // Self collision check
                state.worm.forEach(part => {
                  if (part.x === head.x && part.y === head.y) {
                    state.gameOver = true;
                  }
                });

                if (!state.gameOver) {
                  state.worm.unshift(head);

                  // Eating food
                  if (head.x === state.food.x && head.y === state.food.y) {
                    state.score += 10;
                    setScore(state.score);
                    audio.playPoint();
                    if (state.score % 50 === 0) {
                      onAward(1);
                    }
                    // Generate new food target coordinates
                    let foodPlaced = false;
                    while (!foodPlaced) {
                      const fx = Math.floor(Math.random() * cols);
                      const fy = Math.floor(Math.random() * rows);
                      const overlapping = state.worm.some(p => p.x === fx && p.y === fy);
                      if (!overlapping) {
                        state.food = { x: fx, y: fy };
                        foodPlaced = true;
                      }
                    }
                  } else {
                    state.worm.pop();
                  }
                }
              }

              if (state.gameOver) {
                setGameState("over");
                audio.playHit();
                onSave(state.score, "Retro Worm");
              }

              // Draw Food (Flashing pink wire-packet)
              const fx = state.food.x * state.gridSize;
              const fy = state.food.y * state.gridSize;
              ctx.fillStyle = "#ff007f";
              ctx.strokeStyle = "#fff";
              ctx.lineWidth = 1.5;
              ctx.fillRect(fx + 2, fy + 2, state.gridSize - 4, state.gridSize - 4);
              ctx.strokeRect(fx + 2, fy + 2, state.gridSize - 4, state.gridSize - 4);

              // Draw Glowing Cyber Worm Segments
              state.worm.forEach((part, idx) => {
                const wx = part.x * state.gridSize;
                const wy = part.y * state.gridSize;
                ctx.fillStyle = idx === 0 ? "#ffffff" : "#00ffcc";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 1;
                ctx.fillRect(wx + 1, wy + 1, state.gridSize - 2, state.gridSize - 2);
                ctx.strokeRect(wx + 1, wy + 1, state.gridSize - 2, state.gridSize - 2);
              });

            } else {
              // Menu Stage overlays
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 30, canvas.width - 40, canvas.height - 60);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 30, canvas.width - 40, canvas.height - 60);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("RETRO WORM ENGINE v1.0", canvas.width / 2, 80);
                ctx.fillStyle = "#ff007f";
                ctx.fillText("CLICK HERE / TAP GAME TO START GAME", canvas.width / 2, 140);
                ctx.fillStyle = "gray";
                ctx.fillText("USE WASD OR ARROW KEYS TO NAVIGATE ROUTE", canvas.width / 2, 190);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("CRITICAL WORM SEGFAULT EXCEPTION", canvas.width / 2, 80);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`SCORE ACCUMULATED: ${state.score}`, canvas.width / 2, 130);
                ctx.fillStyle = "white";
                ctx.fillText("TAP SCREEN TO RETRY RUN CONNECTION", canvas.width / 2, 190);
              }
            }

            animId = requestAnimationFrame(render);
          };

          animId = requestAnimationFrame(render);
          return () => cancelAnimationFrame(animId);
        }, [gameState]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">RETRO WORM TERMINAL</span>
              <span className="text-white font-bold">SCORE: {score}</span>
            </div>
            <div 
              onClick={() => { if (gameState !== "playing") resetGame(); }}
              className="relative border-2 border-[#ff007f]/50 bg-black flex-1 flex items-center justify-center cursor-pointer"
            >
              <canvas ref={canvasRef} width={400} height={280} className="w-full aspect-[400/280] block" />
            </div>
            {/* On Screen D-Pad controllers for mobile convenience */}
            <div className="mt-2 grid grid-cols-3 gap-1 max-w-[150px] mx-auto text-xs md:hidden">
              <div></div>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(0, -1); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">▲</button>
              <div></div>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(-1, 0); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">◀</button>
              <button onClick={(e) => { e.stopPropagation(); if (gameState !== "playing") resetGame(); }} className="bg-[#ff007f] text-black py-1 text-center font-bold text-[9px] uppercase">RST</button>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(1, 0); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">▶</button>
              <div></div>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(0, 1); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">▼</button>
              <div></div>
            </div>
            <div className="mt-2 text-center text-[11px] text-gray-500 hidden md:block">
              NAVIGATE THE WORM VIA ARROW KEYS OR W/A/S/D CONTROL SCHEME
            </div>
          </div>
        );
      }

      // Render App inside div ID root
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
