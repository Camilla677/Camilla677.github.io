<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Y2K ARCADE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 50% 30%, #2a004d 0%, #0a0014 50%, #000 100%);
        color: white;
        font-family: 'Press Start 2P', monospace;
        overflow: hidden;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: url('https://cur.cursors-4u.net/cursors/cur-9/cur817.cur'), auto;
    }

    .stars {
        position: fixed;
        inset: 0;
        background: transparent;
        pointer-events: none;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 70px 70px;
        opacity: 0.22;
        z-index: 1;
    }

    .container {
        position: relative;
        z-index: 10;
        text-align: center;
    }

    .header {
        margin-bottom: 40px;
    }

    .title {
        font-size: 5.2rem;
        font-weight: 900;
        letter-spacing: 14px;
        color: #ff00ff;
        text-shadow: 
            0 0 20px #ff00ff,
            4px 4px 0 #00ffff,
            -4px -4px 0 #ffff00;
        animation: glitch 1.8s infinite alternate;
    }

    .subtitle {
        font-size: 1.1rem;
        color: #00ffff;
        letter-spacing: 8px;
        margin-top: -15px;
    }

    .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 24px;
        max-width: 1200px;
        padding: 0 20px;
    }

    .game-card {
        background: rgba(25, 0, 45, 0.75);
        border: 3px solid #ff00ff44;
        border-radius: 12px;
        padding: 24px 16px;
        transition: all 0.4s ease;
        text-decoration: none;
        color: inherit;
        position: relative;
        overflow: hidden;
    }

    .game-card:hover {
        transform: translateY(-18px) scale(1.06);
        border-color: #ff00ff;
        box-shadow: 0 0 50px #ff00ff99;
        background: rgba(50, 0, 80, 0.9);
    }

    .emoji {
        font-size: 4.8rem;
        margin-bottom: 12px;
        transition: transform 0.3s;
    }

    .game-card:hover .emoji {
        transform: scale(1.3) rotate(15deg);
    }

    .game-title {
        font-size: 1.35rem;
        font-weight: bold;
        margin-bottom: 6px;
        letter-spacing: 2px;
    }

    .game-sub {
        font-size: 0.85rem;
        color: #ffffff88;
        line-height: 1.3;
    }

    @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-4px, 4px); }
        40% { transform: translate(4px, -4px); }
        60% { transform: translate(-2px, 2px); }
        100% { transform: translate(0); }
    }

    .footer {
        margin-top: 50px;
        color: #ffffff33;
        font-size: 0.75rem;
        letter-spacing: 3px;
    }
</style>
</head>
<body>

<div class="stars"></div>

<div class="container">
    <div class="header">
        <div class="title">Y2K</div>
        <div class="subtitle">ARCADE</div>
    </div>

    <div class="games-grid">
        <a href="space-runner.html" class="game-card">
            <div class="emoji">🚗</div>
            <div class="game-title" style="color:#ff00ff">SPACE RUNNER</div>
            <div class="game-sub">Jump over neon debris</div>
        </a>

        <a href="snake.html" class="game-card">
            <div class="emoji">🐍</div>
            <div class="game-title" style="color:#00ffff">NEON SNAKE</div>
            <div class="game-sub">Eat or be eaten</div>
        </a>

        <a href="pong.html" class="game-card">
            <div class="emoji">🏓</div>
            <div class="game-title" style="color:#ffff00">NEON PONG</div>
            <div class="game-sub">First to 7 wins</div>
        </a>

        <a href="tetris.html" class="game-card">
            <div class="emoji">🧩</div>
            <div class="game-title" style="color:#00ff88">NEON TETRIS</div>
            <div class="game-sub">Stack the blocks</div>
        </a>

        <a href="breakout.html" class="game-card">
            <div class="emoji">🧱</div>
            <div class="game-title" style="color:#ff8800">NEON BREAKOUT</div>
            <div class="game-sub">Destroy the wall</div>
        </a>

        <a href="flappy.html" class="game-card">
            <div class="emoji">🕹️</div>
            <div class="game-title" style="color:#ff00aa">NEON BIRD</div>
            <div class="game-sub">Don't crash</div>
        </a>
    </div>

    <div class="footer">
        1999 CALLED • THEY WANT THEIR VIBES BACK
    </div>
</div>

<script>
    console.log("%cY2K ARCADE LOADED ✨", "color:#ff00ff; font-size:16px; font-family:monospace");
</script>

</body>
</html>
