<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y2K RETRO ARCADE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM UMD builds -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Retro LCD Web Font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Share Tech Mono', monospace;
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .scanline-effect {
        animation: scanline 8s linear infinite;
      }
    </style>
  </head>
  <body class="bg-[#05010d] text-[#00ffcc] overflow-x-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      // --- WEB AUDIO ENGINE & SEQUENCER (Synth Radio Station) ---
      class RadioEngine {
        constructor() {
          this.ctx = null;
          this.isPlaying = false;
          this.trackIndex = 0;
          this.tempo = 125;
          this.currentBeat = 0;
          this.timerId = null;
          this.muted = false;
          this.freqs = [110, 130, 146, 165]; // Bassline notes
        }

        init() {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (this.ctx.state === "suspended") {
            this.ctx.resume();
          }
        }

        playSFX(freq, type, duration, slideTo = null) {
          if (!this.ctx || this.muted) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        }

        startRadio() {
          this.init();
          if (this.isPlaying) return;
          this.isPlaying = true;
          this.currentBeat = 0;
          
          const scheduleAhead = 0.15;
          let nextNoteTime = this.ctx.currentTime;

          const scheduler = () => {
            while (nextNoteTime < this.ctx.currentTime + scheduleAhead) {
              this.playStationBeat(this.currentBeat, nextNoteTime);
              const secondsPerBeat = 60.0 / this.tempo / 2;
              nextNoteTime += secondsPerBeat;
              this.currentBeat = (this.currentBeat + 1) % 16;
            }
            this.timerId = setTimeout(scheduler, 50);
          };
          scheduler();
        }

        stopRadio() {
          this.isPlaying = false;
          if (this.timerId) {
            clearTimeout(this.timerId);
            this.timerId = null;
          }
        }

        playStationBeat(beat, time) {
          if (this.muted) return;
          
          const noteIndex = Math.floor(beat / 4) % this.freqs.length;
          const baseFreq = this.freqs[noteIndex];

          if (beat % 2 === 0) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(baseFreq, time);
            gain.gain.setValueAtTime(0.05, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + 0.2);
          }

          if (this.trackIndex === 0) {
            if (beat % 4 === 0 || beat === 7 || beat === 11) {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(baseFreq * 3, time);
              gain.gain.setValueAtTime(0.02, time);
              gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(time);
              osc.stop(time + 0.12);
            }
          } else {
            if (beat % 3 === 0) {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = "square";
              osc.frequency.setValueAtTime(baseFreq * 4, time);
              gain.gain.setValueAtTime(0.015, time);
              gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(time);
              osc.stop(time + 0.08);
            }
          }
        }
      }

      const radio = new RadioEngine();

      const TRACK_LIST = [
        { name: "TRACK_01: ELECTRO_CYBER.MID", tempo: 130 },
        { name: "TRACK_02: CHIP_RUNNER.MID", tempo: 118 }
      ];

      // --- MAIN RETRO CONSOLE ---
      function App() {
        const [activeGame, setActiveGame] = useState("lobby");
        const [isPlayingMusic, setIsPlayingMusic] = useState(false);
        const [trackIndex, setTrackIndex] = useState(0);
        const [crtFilter, setCrtFilter] = useState(true);

        const handleToggleMusic = () => {
          radio.init();
          if (isPlayingMusic) {
            radio.stopRadio();
            setIsPlayingMusic(false);
          } else {
            radio.startRadio();
            setIsPlayingMusic(true);
          }
        };

        const handleNextTrack = () => {
          radio.init();
          const nextIndex = (trackIndex + 1) % TRACK_LIST.length;
          radio.trackIndex = nextIndex;
          radio.tempo = TRACK_LIST[nextIndex].tempo;
          setTrackIndex(nextIndex);
          if (!isPlayingMusic) {
            radio.startRadio();
            setIsPlayingMusic(true);
          } else {
            radio.stopRadio();
            radio.startRadio();
          }
          radio.playSFX(880, 'sine', 0.1);
        };

        return (
          <div className="min-h-screen bg-[#04010a] text-[#00ffcc] flex flex-col relative overflow-hidden">
            {/* CRT TV Visual Layer */}
            {crtFilter && (
              <div className="pointer-events-none fixed inset-0 z-50 opacity-[0.08] overflow-hidden">
                <div className="scanline-effect w-full h-full bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.45)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_6px,6px_100%]" />
              </div>
            )}

            {/* Subdued Header */}
            <header className="border-b-2 border-gray-800 bg-[#0c051a] p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-10">
              <span className="text-sm font-bold tracking-widest text-[#00ffcc]">ARCADE STATION</span>

              {/* Radio Controller HUD */}
              <div className="flex flex-wrap items-center gap-3 bg-[#110924] border border-[#00ffcc]/20 p-2 rounded w-full md:w-auto">
                <div className="flex flex-col flex-1 md:flex-none md:w-56 overflow-hidden">
                  <span className="text-[10px] text-gray-400">RADIO FREQUENCY:</span>
                  <span className="text-xs text-white truncate font-mono">
                    {isPlayingMusic ? TRACK_LIST[trackIndex].name : "OFFLINE"}
                  </span>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={handleToggleMusic}
                    className="px-3 py-1 bg-gray-800 text-[#00ffcc] hover:bg-white hover:text-black text-xs font-bold transition-colors"
                  >
                    {isPlayingMusic ? "PAUSE" : "PLAY"}
                  </button>
                  <button
                    onClick={handleNextTrack}
                    className="px-3 py-1 border border-gray-600 text-xs text-white font-bold"
                  >
                    SKIP
                  </button>
                </div>

                <button
                  onClick={() => setCrtFilter(!crtFilter)}
                  className={`px-2 py-1 border text-xs font-bold ${crtFilter ? 'bg-[#00ffcc] text-black border-transparent' : 'border-gray-600 text-gray-500'}`}
                >
                  CRT
                </button>
              </div>
            </header>

            {/* Core Game Container */}
            <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 flex flex-col justify-center z-10">
              
              {/* Dynamic Screen Housing */}
              <div className="border-4 border-[#00ffcc] bg-black p-4 rounded-xl min-h-[440px] relative flex flex-col shadow-[0_0_20px_rgba(0,255,204,0.1)]">
                {activeGame === "lobby" ? (
                  <div className="flex-1 flex flex-col justify-center items-center text-center p-4">
                    <p className="text-xs text-gray-400 max-w-sm mb-8 font-mono">
                      Select a game module to launch its canvas terminal.
                    </p>

                    <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                      <div onClick={() => { radio.playSFX(440, 'sine', 0.1); setActiveGame("flappy"); }} className="border-2 border-[#ff007f]/50 hover:border-[#ff007f] hover:bg-[#ff007f]/5 p-4 rounded cursor-pointer transition-all text-center">
                        <span className="text-3xl block mb-1">🐦</span>
                        <h4 className="text-xs font-extrabold text-white">1. FLAPPY BIRD</h4>
                      </div>
                      <div onClick={() => { radio.playSFX(440, 'sine', 0.1); setActiveGame("jumper"); }} className="border-2 border-[#00ffcc]/50 hover:border-[#00ffcc] hover:bg-[#00ffcc]/5 p-4 rounded cursor-pointer transition-all text-center">
                        <span className="text-3xl block mb-1">🦒</span>
                        <h4 className="text-xs font-extrabold text-white">2. FENCE JUMPER</h4>
                      </div>
                      <div onClick={() => { radio.playSFX(440, 'sine', 0.1); setActiveGame("pong"); }} className="border-2 border-[#00ffcc]/50 hover:border-[#00ffcc] hover:bg-[#00ffcc]/5 p-4 rounded cursor-pointer transition-all text-center">
                        <span className="text-3xl block mb-1">🏓</span>
                        <h4 className="text-xs font-extrabold text-white">3. NEON PONG</h4>
                      </div>
                      <div onClick={() => { radio.playSFX(440, 'sine', 0.1); setActiveGame("worm"); }} className="border-2 border-[#ff007f]/50 hover:border-[#ff007f] hover:bg-[#ff007f]/5 p-4 rounded cursor-pointer transition-all text-center">
                        <span className="text-3xl block mb-1">🐍</span>
                        <h4 className="text-xs font-extrabold text-white">4. RETRO WORM</h4>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col">
                    {/* Navigation bar inside active game screens to return to Lobby */}
                    <div className="flex justify-between items-center border-b border-[#00ffcc]/20 pb-2 mb-3">
                      <button 
                        onClick={() => { radio.playSFX(150, 'triangle', 0.15); setActiveGame("lobby"); }}
                        className="text-xs font-bold text-[#ff007f] hover:text-white transition-colors"
                      >
                        ← BACK TO LOBBY
                      </button>
                    </div>
                    {activeGame === "flappy" && <FlappyBirdGame />}
                    {activeGame === "jumper" && <FenceJumperGame />}
                    {activeGame === "pong" && <PongGame />}
                    {activeGame === "worm" && <WormGame />}
                  </div>
                )}
              </div>
            </main>

            <footer className="bg-black text-[10px] text-gray-600 text-center py-3 border-t border-gray-900 mt-auto">
              SYSTEM ONLINE. SELECT A GAME FROM THE LOBBY CONTAINER.
            </footer>
          </div>
        );
      }

      // --- GAME 1: FLAPPY BIRD (Scaled down to be smaller & more forgiving) ---
      function FlappyBirdGame() {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);
        const [countdown, setCountdown] = useState(3);

        const stateRef = useRef({
          birdY: 150,
          velocity: 0,
          gravity: 0.35,
          jump: -6.5,
          pipes: [],
          frame: 0,
          score: 0,
          gameOver: false
        });

        const resetGame = () => {
          stateRef.current = {
            birdY: 150,
            velocity: 0,
            gravity: 0.35,
            jump: -6.5,
            pipes: [],
            frame: 0,
            score: 0,
            gameOver: false
          };
          setScore(0);
          setCountdown(3);
          setGameState("countdown");
          radio.playSFX(440, 'sine', 0.1);
        };

        const handleAction = () => {
          if (gameState === "idle" || gameState === "over") {
            resetGame();
          } else if (gameState === "playing") {
            stateRef.current.velocity = stateRef.current.jump;
            radio.playSFX(150, 'triangle', 0.2, 600);
          }
        };

        useEffect(() => {
          if (gameState !== "countdown") return;
          
          let timer = 3;
          const interval = setInterval(() => {
            timer--;
            if (timer > 0) {
              setCountdown(timer);
              radio.playSFX(440, 'sine', 0.1);
            } else {
              clearInterval(interval);
              setGameState("playing");
              radio.playSFX(880, 'sine', 0.2);
            }
          }, 1000);

          return () => clearInterval(interval);
        }, [gameState]);

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === " " || e.key === "ArrowUp") {
              e.preventDefault();
              handleAction();
            }
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [gameState]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animId;

          const render = () => {
            const state = stateRef.current;
            ctx.fillStyle = "#03010b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tech visual grid
            ctx.strokeStyle = "rgba(0, 255, 120, 0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
              ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            if (gameState === "playing") {
              state.frame++;
              state.velocity += state.gravity;
              state.birdY += state.velocity;

              if (state.frame % 90 === 0) {
                const gap = 90;
                const minH = 40;
                const maxH = canvas.height - gap - minH;
                const topH = Math.floor(Math.random() * (maxH - minH)) + minH;
                state.pipes.push({
                  x: canvas.width,
                  topHeight: topH,
                  bottomY: topH + gap,
                  width: 35,
                  passed: false
                });
              }

              for (let i = state.pipes.length - 1; i >= 0; i--) {
                const p = state.pipes[i];
                p.x -= 2;

                ctx.fillStyle = "rgba(255, 0, 127, 0.25)";
                ctx.strokeStyle = "#ff007f";
                ctx.lineWidth = 2;
                ctx.fillRect(p.x, 0, p.width, p.topHeight);
                ctx.strokeRect(p.x, 0, p.width, p.topHeight);
                ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
                ctx.strokeRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);

                if (!p.passed && p.x + p.width < 50) {
                  p.passed = true;
                  state.score++;
                  setScore(state.score);
                  radio.playSFX(880, 'sine', 0.08, 1200);
                }

                // Collision detection adjusted to 7px radius for the smaller bird size
                const bRadius = 7;
                if (
                  (50 + bRadius > p.x && 50 - bRadius < p.x + p.width) &&
                  (state.birdY - bRadius < p.topHeight || state.birdY + bRadius > p.bottomY)
                ) {
                  state.gameOver = true;
                }

                if (p.x + p.width < 0) {
                  state.pipes.splice(i, 1);
                }
              }

              if (state.birdY > canvas.height || state.birdY < 0) {
                state.gameOver = true;
              }

              if (state.gameOver) {
                setGameState("over");
                radio.playSFX(300, 'sawtooth', 0.3, 40);
              }

              // Render smaller bird coordinates (scaled down by ~30%)
              ctx.save();
              ctx.translate(50, state.birdY);
              const angle = Math.min(Math.max(state.velocity * 0.08, -0.6), 0.8);
              ctx.rotate(angle);
              ctx.fillStyle = "#00ffcc";
              ctx.strokeStyle = "#fff";
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(8, 0);       // Head point (was 12)
              ctx.lineTo(-7, -7);     // Upper back tail (was -10, -10)
              ctx.lineTo(-4, 0);      // Middle recess (was -6, 0)
              ctx.lineTo(-7, 7);      // Lower back tail (was -10, 10)
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            } else if (gameState === "countdown") {
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 40, canvas.width - 40, canvas.height - 80);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 40, canvas.width - 40, canvas.height - 80);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = 'bold 24px "Share Tech Mono", monospace';
              ctx.fillText("READY?", canvas.width / 2, 100);

              ctx.font = 'bold 54px "Share Tech Mono", monospace';
              ctx.fillStyle = "#ff007f";
              ctx.fillText(countdown, canvas.width / 2, 165);

              // Render stationary smaller bird
              ctx.save();
              ctx.translate(50, state.birdY);
              ctx.fillStyle = "#00ffcc";
              ctx.strokeStyle = "#fff";
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(8, 0);
              ctx.lineTo(-7, -7);
              ctx.lineTo(-4, 0);
              ctx.lineTo(-7, 7);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            } else {
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 40, canvas.width - 40, canvas.height - 80);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 40, canvas.width - 40, canvas.height - 80);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("TAP SCREEN OR PRESS SPACE TO START", canvas.width / 2, 140);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("COLLISION DETECTED", canvas.width / 2, 90);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`SCORE: ${state.score}`, canvas.width / 2, 140);
                ctx.fillStyle = "white";
                ctx.fillText("TAP SCREEN TO RETRY", canvas.width / 2, 190);
              }
            }

            animId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animId);
        }, [gameState, countdown]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">FLAPPY CYBER-BIRD</span>
              <span className="text-white font-bold">SCORE: {score}</span>
            </div>
            <div onClick={handleAction} className="relative border-2 border-[#ff007f]/50 bg-black flex-1 flex items-center justify-center cursor-pointer">
              <canvas ref={canvasRef} width={400} height={250} className="w-full aspect-[400/250] block" />
            </div>
          </div>
        );
      }

      // --- GAME 2: CYBER GIRAFFE JUMPER ---
      function FenceJumperGame() {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);

        const stateRef = useRef({
          playerY: 0,
          velocity: 0,
          gravity: 0.6,
          isGrounded: true,
          obstacles: [],
          speed: 4.5,
          score: 0,
          frame: 0,
          gameOver: false
        });

        const resetGame = () => {
          stateRef.current = {
            playerY: 0,
            velocity: 0,
            gravity: 0.5,
            isGrounded: true,
            obstacles: [],
            speed: 4.5,
            score: 0,
            frame: 0,
            gameOver: false
          };
          setScore(0);
          setGameState("playing");
          radio.playSFX(587.33, 'square', 0.15, 880);
        };

        const handleJump = () => {
          if (gameState === "idle" || gameState === "over") {
            resetGame();
          } else if (stateRef.current.isGrounded) {
            stateRef.current.velocity = -9;
            stateRef.current.isGrounded = false;
            radio.playSFX(150, 'triangle', 0.2, 600);
          }
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === " " || e.key === "ArrowUp") {
              e.preventDefault();
              handleJump();
            }
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [gameState]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animId;

          const render = () => {
            const state = stateRef.current;
            ctx.fillStyle = "#020108";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const floorY = canvas.height - 40;

            ctx.strokeStyle = "#ff007f";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            if (gameState === "playing") {
              state.frame++;
              state.velocity += state.gravity;
              state.playerY += state.velocity;

              if (state.playerY >= 0) {
                state.playerY = 0;
                state.velocity = 0;
                state.isGrounded = true;
              }

              state.score++;
              if (state.score % 10 === 0) {
                setScore(Math.floor(state.score / 10));
              }

              state.speed = 4.5 + Math.floor(state.score / 250) * 0.5;

              if (state.frame % 110 === 0) {
                state.obstacles.push({
                  x: canvas.width,
                  width: 15 + Math.random() * 10,
                  height: 25 + Math.random() * 15
                });
              }

              for (let i = state.obstacles.length - 1; i >= 0; i--) {
                const obs = state.obstacles[i];
                obs.x -= state.speed;

                ctx.fillStyle = "#00ffcc";
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.fillRect(obs.x, floorY - obs.height, obs.width, obs.height);
                ctx.strokeRect(obs.x, floorY - obs.height, obs.width, obs.height);

                const playerHeight = 45;
                const playerWidth = 22;
                const playerX = 60;
                const realPlayerY = floorY - playerHeight + state.playerY;

                if (
                  playerX < obs.x + obs.width &&
                  playerX + playerWidth > obs.x &&
                  realPlayerY + playerHeight > floorY - obs.height
                ) {
                  state.gameOver = true;
                }

                if (obs.x + obs.width < 0) {
                  state.obstacles.splice(i, 1);
                }
              }

              if (state.gameOver) {
                setGameState("over");
                radio.playSFX(300, 'sawtooth', 0.3, 40);
              }

              // --- NEON CYBER GIRAFFE RENDER ---
              const px = 60;
              const py = floorY - 45 + state.playerY;

              ctx.fillStyle = "#ffcc00";
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 1;

              let backLegSwing = 0;
              let frontLegSwing = 0;
              if (state.isGrounded) {
                const swingFreq = 0.45;
                backLegSwing = Math.sin(state.frame * swingFreq) * 5;
                frontLegSwing = -Math.sin(state.frame * swingFreq) * 5;
              } else {
                backLegSwing = -3;
                frontLegSwing = 3;
              }

              ctx.fillRect(px + 4, py + 30, 3, 7);
              ctx.fillRect(px + 4 + backLegSwing, py + 37, 3, 8);

              ctx.fillRect(px + 12, py + 30, 3, 7);
              ctx.fillRect(px + 12 + frontLegSwing, py + 37, 3, 8);

              ctx.fillStyle = "#ffcc00";
              ctx.fillRect(px + 2, py + 16, 16, 14);

              ctx.fillStyle = "#ff007f";
              ctx.fillRect(px + 5, py + 19, 3, 3);
              ctx.fillRect(px + 11, py + 23, 3, 3);
              ctx.fillRect(px + 6, py + 25, 2, 2);

              ctx.fillStyle = "#ffcc00";
              ctx.fillRect(px + 13, py + 2, 4, 15);

              ctx.fillStyle = "#ff007f";
              ctx.fillRect(px + 14, py + 6, 2, 2);
              ctx.fillRect(px + 14, py + 11, 2, 2);

              ctx.fillStyle = "#ffcc00";
              ctx.fillRect(px + 13, py - 3, 8, 6);

              ctx.fillRect(px + 14, py - 6, 2, 3);

              ctx.fillStyle = "#000000";
              ctx.fillRect(px + 18, py - 1, 2, 2);

            } else {
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 30, canvas.width - 40, canvas.height - 60);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 30, canvas.width - 40, canvas.height - 60);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("TAP SCREEN OR SPACE TO START GIRAFFE RUN", canvas.width / 2, 140);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("IMPACT COLLISION", canvas.width / 2, 80);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`SCORE: ${Math.floor(state.score / 10)}`, canvas.width / 2, 130);
                ctx.fillStyle = "white";
                ctx.fillText("TAP SCREEN TO RETRY", canvas.width / 2, 190);
              }
            }

            animId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animId);
        }, [gameState]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">CYBER GIRAFFE JUMPER</span>
              <span className="text-white font-bold">SCORE: {score}</span>
            </div>
            <div onClick={handleJump} className="relative border-2 border-[#00ffcc]/50 bg-black flex-1 flex items-center justify-center cursor-pointer">
              <canvas ref={canvasRef} width={400} height={250} className="w-full aspect-[400/250] block" />
            </div>
          </div>
        );
      }

      // --- GAME 3: NEON PONG ---
      const W = 800, H = 500;
      const PADDLE_W = 12, PADDLE_H = 80;
      const BALL_R = 8;
      const WIN_SCORE = 7;
      const AI_SPEED = 4;

      function PongGame() {
        const canvasRef = useRef(null);
        const stateRef = useRef(null);
        const animRef = useRef(null);
        const keysRef = useRef({});
        const [winner, setWinner] = useState(null);
        const winnerRef = useRef(null);

        const initState = useCallback(() => ({
          ball: { x: W / 2, y: H / 2, vx: (Math.random() > 0.5 ? 1 : -1) * 5, vy: (Math.random() - 0.5) * 6 },
          player: { y: H / 2 - PADDLE_H / 2 },
          ai: { y: H / 2 - PADDLE_H / 2 },
          scoreP: 0, scoreAI: 0,
          over: false,
          particles: [],
        }), []);

        const restart = useCallback(() => {
          stateRef.current = initState();
          setWinner(null);
          radio.playSFX(587.33, 'square', 0.15, 880);
        }, [initState]);

        useEffect(() => {
          stateRef.current = initState();
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          canvas.width = W;
          canvas.height = H;

          const onKey = (e) => { keysRef.current[e.code] = e.type === 'keydown'; };
          window.addEventListener('keydown', onKey);
          window.addEventListener('keyup', onKey);

          function resetBall(gs, dir) {
            gs.ball = { x: W / 2, y: H / 2, vx: dir * (4.5 + Math.random()), vy: (Math.random() - 0.5) * 6 };
          }

          function burst(gs, x, y, color) {
            for (let i = 0; i < 12; i++) {
              gs.particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1, color });
            }
          }

          let lastTime = performance.now();
          function loop(time) {
            const gs = stateRef.current;
            if (!gs) return;
            const dt = Math.min((time - lastTime) / 16.67, 2);
            lastTime = time;

            if (!gs.over) {
              const speed = 6;
              if (keysRef.current['ArrowUp'] || keysRef.current['KeyW']) gs.player.y -= speed * dt;
              if (keysRef.current['ArrowDown'] || keysRef.current['KeyS']) gs.player.y += speed * dt;
              gs.player.y = Math.max(0, Math.min(H - PADDLE_H, gs.player.y));

              const aiCenter = gs.ai.y + PADDLE_H / 2;
              if (aiCenter < gs.ball.y - 10) gs.ai.y += AI_SPEED * dt;
              else if (aiCenter > gs.ball.y + 10) gs.ai.y -= AI_SPEED * dt;
              gs.ai.y = Math.max(0, Math.min(H - PADDLE_H, gs.ai.y));

              gs.ball.x += gs.ball.vx * dt;
              gs.ball.y += gs.ball.vy * dt;

              if (gs.ball.y - BALL_R < 0) {
                gs.ball.y = BALL_R;
                gs.ball.vy *= -1;
                radio.playSFX(330, 'sine', 0.05);
              }
              if (gs.ball.y + BALL_R > H) {
                gs.ball.y = H - BALL_R;
                gs.ball.vy *= -1;
                radio.playSFX(330, 'sine', 0.05);
              }

              const px = 20;
              if (gs.ball.vx < 0 && gs.ball.x - BALL_R < px + PADDLE_W && gs.ball.x + BALL_R > px &&
                  gs.ball.y > gs.player.y && gs.ball.y < gs.player.y + PADDLE_H) {
                gs.ball.x = px + PADDLE_W + BALL_R;
                const rel = (gs.ball.y - (gs.player.y + PADDLE_H / 2)) / (PADDLE_H / 2);
                gs.ball.vy = rel * 7;
                gs.ball.vx = Math.abs(gs.ball.vx) * 1.05;
                burst(gs, px + PADDLE_W, gs.ball.y, '#00ffff');
                radio.playSFX(880, 'sine', 0.08, 1200);
              }

              const ax = W - 20 - PADDLE_W;
              if (gs.ball.vx > 0 && gs.ball.x + BALL_R > ax && gs.ball.x - BALL_R < ax + PADDLE_W &&
                  gs.ball.y > gs.ai.y && gs.ball.y < gs.ai.y + PADDLE_H) {
                gs.ball.x = ax - BALL_R;
                const rel = (gs.ball.y - (gs.ai.y + PADDLE_H / 2)) / (PADDLE_H / 2);
                gs.ball.vy = rel * 7;
                gs.ball.vx = -Math.abs(gs.ball.vx) * 1.05;
                burst(gs, ax, gs.ball.y, '#ff00ff');
                radio.playSFX(440, 'sine', 0.05);
              }

              if (gs.ball.x < 0) {
                gs.scoreAI++;
                burst(gs, 0, gs.ball.y, '#ff0000');
                radio.playSFX(300, 'sawtooth', 0.25);
                if (gs.scoreAI >= WIN_SCORE) {
                  gs.over = true;
                  if (winnerRef.current) winnerRef.current('AI');
                } else {
                  resetBall(gs, 1);
                }
              }
              if (gs.ball.x > W) {
                gs.scoreP++;
                burst(gs, W, gs.ball.y, '#00ff00');
                radio.playSFX(659.25, 'sine', 0.15);
                if (gs.scoreP >= WIN_SCORE) {
                  gs.over = true;
                  if (winnerRef.current) winnerRef.current('YOU');
                } else {
                  resetBall(gs, -1);
                }
              }
            }

            ctx.fillStyle = '#05000f';
            ctx.fillRect(0, 0, W, H);

            ctx.setLineDash([10, 14]);
            ctx.strokeStyle = 'rgba(255,0,255,0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
            ctx.setLineDash([]);

            gs.particles = gs.particles.filter(p => {
              p.x += p.vx; p.y += p.vy; p.life -= 0.05;
              if (p.life <= 0) return false;
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath(); ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2); ctx.fill();
              ctx.globalAlpha = 1;
              return true;
            });

            ctx.fillStyle = '#00ffff';
            ctx.fillRect(20, gs.player.y, PADDLE_W, PADDLE_H);

            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(W - 20 - PADDLE_W, gs.ai.y, PADDLE_W, PADDLE_H);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(gs.ball.x, gs.ball.y, BALL_R, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(gs.scoreP, W / 2 - 80, 60);
            ctx.fillStyle = '#ff00ff';
            ctx.fillText(gs.scoreAI, W / 2 + 80, 60);

            ctx.font = '11px monospace';
            ctx.fillStyle = '#00ffff88';
            ctx.fillText('YOU', W / 2 - 80, 78);
            ctx.fillStyle = '#ff00ff88';
            ctx.fillText('AI', W / 2 + 80, 78);

            if (gs.over) {
              ctx.fillStyle = 'rgba(0,0,0,0.5)';
              ctx.fillRect(0, 0, W, H);
            }

            animRef.current = requestAnimationFrame(loop);
          }

          winnerRef.current = setWinner;
          animRef.current = requestAnimationFrame(loop);
          return () => {
            cancelAnimationFrame(animRef.current);
            window.removeEventListener('keydown', onKey);
            window.removeEventListener('keyup', onKey);
          };
        }, [initState]);

        const winColor = winner === 'YOU' ? '#00ffff' : '#ff00ff';

        return (
          <div className="flex-1 flex flex-col justify-between min-h-[300px] relative">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">NEON PONG</span>
              <span className="text-[#00ffcc] font-bold">W/S or Up/Down arrows to steer paddle</span>
            </div>

            <div className="relative border-2 border-[#00ffff]/50 bg-black flex-1 flex items-center justify-center overflow-hidden">
              <canvas ref={canvasRef} className="w-full aspect-[800/500] block" />

              {winner && (
                <div className="absolute inset-0 flex items-center justify-center z-10 bg-black/60">
                  <div className="bg-[#1a0033]/90 border-2 rounded-xl p-6 text-center" style={{ borderColor: winColor }}>
                    <div className="text-3xl mb-1">{winner === 'YOU' ? '🏆' : '🤖'}</div>
                    <div className="text-xl font-bold tracking-widest mb-1" style={{ color: winColor }}>
                      {winner === 'YOU' ? 'YOU WIN!' : 'AI WINS!'}
                    </div>
                    <p className="text-gray-400 text-xs mb-4">
                      {winner === 'YOU' ? 'Impressive moves, human.' : 'The machine is superior. Try again.'}
                    </p>
                    <button 
                      onClick={restart} 
                      className="px-6 py-2 rounded text-xs font-bold font-mono tracking-widest text-black uppercase transition-transform active:scale-95" 
                      style={{ backgroundColor: winColor }}
                    >
                      PLAY AGAIN
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // --- GAME 4: RETRO WORM ---
      function WormGame() {
        const canvasRef = useRef(null);
        const [gameState, setGameState] = useState("idle");
        const [score, setScore] = useState(0);

        const stateRef = useRef({
          worm: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
          dx: 1,
          dy: 0,
          food: { x: 15, y: 10 },
          gridSize: 20,
          score: 0,
          gameOver: false,
          lastUpdate: 0,
          speed: 170
        });

        const resetGame = () => {
          stateRef.current = {
            worm: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
            dx: 1,
            dy: 0,
            food: { x: 15, y: 12 },
            gridSize: 20,
            score: 0,
            gameOver: false,
            lastUpdate: 0,
            speed: 170
          };
          setScore(0);
          setGameState("playing");
          radio.playSFX(587.33, 'square', 0.15, 880);
        };

        const changeDirection = (newDx, newDy) => {
          const current = stateRef.current;
          if (newDx === -current.dx || newDy === -current.dy) return;
          current.dx = newDx;
          current.dy = newDy;
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (gameState !== "playing") return;
            if (e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); changeDirection(0, -1); }
            if (e.key === "ArrowDown" || e.key === "s") { e.preventDefault(); changeDirection(0, 1); }
            if (e.key === "ArrowLeft" || e.key === "a") { e.preventDefault(); changeDirection(-1, 0); }
            if (e.key === "ArrowRight" || e.key === "d") { e.preventDefault(); changeDirection(1, 0); }
          };

          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [gameState]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animId;

          const render = (time) => {
            const state = stateRef.current;
            const cols = canvas.width / state.gridSize;
            const rows = canvas.height / state.gridSize;

            ctx.fillStyle = "#02010c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "playing") {
              if (time - state.lastUpdate > state.speed) {
                state.lastUpdate = time;

                const head = { x: state.worm[0].x + state.dx, y: state.worm[0].y + state.dy };

                if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                  state.gameOver = true;
                }

                state.worm.forEach(part => {
                  if (part.x === head.x && part.y === head.y) {
                    state.gameOver = true;
                  }
                });

                if (!state.gameOver) {
                  state.worm.unshift(head);

                  if (head.x === state.food.x && head.y === state.food.y) {
                    state.score += 10;
                    setScore(state.score);
                    radio.playSFX(880, 'sine', 0.08, 1200);

                    let foodPlaced = false;
                    while (!foodPlaced) {
                      const fx = Math.floor(Math.random() * cols);
                      const fy = Math.floor(Math.random() * rows);
                      const overlapping = state.worm.some(p => p.x === fx && p.y === fy);
                      if (!overlapping) {
                        state.food = { x: fx, y: fy };
                        foodPlaced = true;
                      }
                    }
                  } else {
                    state.worm.pop();
                  }
                }
              }

              if (state.gameOver) {
                setGameState("over");
                radio.playSFX(300, 'sawtooth', 0.3, 40);
              }

              const fx = state.food.x * state.gridSize + state.gridSize / 2;
              const fy = state.food.y * state.gridSize + state.gridSize / 2;
              
              ctx.fillStyle = "#388e3c";
              ctx.beginPath();
              ctx.ellipse(fx, fy, 7, 5, Math.PI / 4, 0, Math.PI * 2);
              ctx.fill();
              
              ctx.strokeStyle = "#1b5e20";
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(fx - 4, fy + 4);
              ctx.lineTo(fx - 8, fy + 8);
              ctx.stroke();

              for (let i = state.worm.length - 1; i >= 0; i--) {
                const part = state.worm[i];
                const wx = part.x * state.gridSize + state.gridSize / 2;
                const wy = part.y * state.gridSize + state.gridSize / 2;

                let radius = state.gridSize / 2 - 1.5;
                if (i > state.worm.length - 5) {
                  const tailStep = (state.worm.length - 1 - i) / 4;
                  radius = (state.gridSize / 2 - 1.5) * (0.55 + tailStep * 0.45);
                }

                const isClitellum = i >= 4 && i <= 6;
                if (isClitellum) {
                  radius += 1.8;
                }

                let color = "#ff9a8b";
                if (i === 0) {
                  color = "#ff6b6b";
                } else if (isClitellum) {
                  color = "#ffb0a0";
                } else {
                  color = i % 2 === 0 ? "#f08080" : "#ff8a80";
                }

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(wx, wy, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgba(0, 0, 0, 0.16)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(wx, wy, radius - 2, 0, Math.PI * 2);
                ctx.stroke();

                if (i === 0) {
                  let eyeX1 = wx - 3, eyeY1 = wy - 3;
                  let eyeX2 = wx + 3, eyeY2 = wy - 3;
                  if (state.dx === 1) {
                    eyeX1 = wx + 2; eyeY1 = wy - 3;
                    eyeX2 = wx + 2; eyeY2 = wy + 3;
                  } else if (state.dx === -1) {
                    eyeX1 = wx - 2; eyeY1 = wy - 3;
                    eyeX2 = wx - 2; eyeY2 = wy + 3;
                  } else if (state.dy === 1) {
                    eyeX1 = wx - 3; eyeY1 = wy + 2;
                    eyeX2 = wx + 3; eyeY2 = wy + 2;
                  }
                  ctx.fillStyle = "#000000";
                  ctx.beginPath();
                  ctx.arc(eyeX1, eyeY1, 1.3, 0, Math.PI * 2);
                  ctx.arc(eyeX2, eyeY2, 1.3, 0, Math.PI * 2);
                  ctx.fill();
                }
              }

            } else {
              ctx.fillStyle = "rgba(12, 5, 26, 0.85)";
              ctx.fillRect(20, 30, canvas.width - 40, canvas.height - 60);
              ctx.strokeStyle = "#00ffcc";
              ctx.strokeRect(20, 30, canvas.width - 40, canvas.height - 60);

              ctx.fillStyle = "#ffffff";
              ctx.textAlign = "center";
              ctx.font = '12px "Share Tech Mono", monospace';

              if (gameState === "idle") {
                ctx.fillText("TAP SCREEN TO START WORM RUN", canvas.width / 2, 140);
              } else if (gameState === "over") {
                ctx.fillStyle = "#ff007f";
                ctx.fillText("WORM COLLISION EXCEPTION", canvas.width / 2, 80);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`SCORE: ${state.score}`, canvas.width / 2, 130);
                ctx.fillStyle = "white";
                ctx.fillText("TAP SCREEN TO RETRY", canvas.width / 2, 190);
              }
            }

            animId = requestAnimationFrame(render);
          };

          animId = requestAnimationFrame(render);
          return () => cancelAnimationFrame(animId);
        }, [gameState]);

        return (
          <div className="flex-1 flex flex-col justify-between">
            <div className="flex justify-between items-center text-xs mb-2">
              <span className="text-gray-400">RETRO WORM</span>
              <span className="text-white font-bold">SCORE: {score}</span>
            </div>
            <div 
              onClick={() => { if (gameState !== "playing") resetGame(); }}
              className="relative border-2 border-[#ff007f]/50 bg-black flex-1 flex items-center justify-center cursor-pointer"
            >
              <canvas ref={canvasRef} width={400} height={250} className="w-full aspect-[400/250] block" />
            </div>

            <div className="mt-2 grid grid-cols-3 gap-1 max-w-[120px] mx-auto text-xs md:hidden">
              <div></div>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(0, -1); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">▲</button>
              <div></div>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(-1, 0); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">◀</button>
              <button onClick={(e) => { e.stopPropagation(); if (gameState !== "playing") resetGame(); }} className="bg-[#ff007f] text-black py-1 text-center font-bold text-[9px]">RST</button>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(1, 0); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">▶</button>
              <div></div>
              <button onClick={(e) => { e.stopPropagation(); changeDirection(0, 1); }} className="bg-[#110924] border border-[#00ffcc] py-1 text-center font-bold">▼</button>
              <div></div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
